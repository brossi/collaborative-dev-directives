#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - fail2ban
  - gnupg
  - jq
  - unattended-upgrades
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/50-cannabeats-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      AllowTcpForwarding yes
      GatewayPorts no

runcmd:
  - [systemctl, enable, --now, fail2ban]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, OpenSSH]
  - [ufw, --force, enable]
  - [systemctl, restart, ssh]

final_message: "CannaBeats managed audio-source baseline is ready"
