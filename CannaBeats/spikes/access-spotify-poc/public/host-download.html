<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15261d">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <title>Download CannaBeats Host</title>
    <script src="/host-download.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">Private family host</p>
        <h1>CannaBeats Host</h1>
        <p class="lede">Download the private macOS host launcher, then drag it into Applications.</p>
      </div>
    </header>
    <main>
      <section class="card compact">
        <h2>Your private installer</h2>
        <p>This link is limited and expires with your host invitation. The download starts only when you choose the button below.</p>
        <p id="installer-note" class="fine-print">Checking installer details…</p>
        <button id="download-host" class="primary" type="button" disabled>Preparing secure download…</button>
        <output id="download-status" class="result" aria-live="polite"></output>
      </section>
    </main>
  </body>
</html>
