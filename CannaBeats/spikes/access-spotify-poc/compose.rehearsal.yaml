services:
  app:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${CANNABEATS_REHEARSAL_ACCESS_PORT:?Set rehearsal access port}:3002"
  game:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${CANNABEATS_REHEARSAL_GAME_PORT:?Set rehearsal game port}:3000"
  state:
    ports: !override
      - "127.0.0.1:${CANNABEATS_REHEARSAL_STATE_PORT:?Set rehearsal state port}:3010"
