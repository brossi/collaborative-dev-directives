services:
  app:
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: spikes/access-spotify-poc/Dockerfile
    image: cannabeats/access-spotify-poc:local
    container_name: cannabeats-access-poc
    restart: unless-stopped
    init: true
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-https://poc.cannabeats.social}
      RP_ID: ${RP_ID:-poc.cannabeats.social}
      RP_NAME: ${RP_NAME:-CannaBeats PoC}
      PORT: "3002"
      DATABASE_PATH: /data/cannabeats-poc.sqlite
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      AUDIO_RELAY_ORIGIN: ${AUDIO_RELAY_ORIGIN:-https://cannaudio.cannabeats.social}
      AUDIO_RELAY_INGEST_TOKEN_FILE: ${AUDIO_RELAY_INGEST_TOKEN_FILE:-/run/secrets/cannabeats/audio-relay-ingest-token}
      AUDIO_RELAY_LISTEN_TOKEN_FILE: ${AUDIO_RELAY_LISTEN_TOKEN_FILE:-/run/secrets/cannabeats/audio-relay-listen-token}
      GAME_SERVICE_INTERNAL_ORIGIN: http://game:3000
      GAME_SERVICE_TOKEN_FILE: ${GAME_SERVICE_TOKEN_FILE:-/run/secrets/cannabeats/game-service-token}
      TRUST_PROXY: loopback
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
      CANNABEATS_APP_VERSION: ${CANNABEATS_APP_VERSION:-development}
      CANNABEATS_CATALOG_VERSION: ${CANNABEATS_CATALOG_VERSION:-development}
      CANNABEATS_SCHEMA_MIN_VERSION: "0"
      CANNABEATS_SCHEMA_MAX_VERSION: "2"
      CANNABEATS_SCHEMA_TARGET_VERSION: "1"
      CANNABEATS_ENVIRONMENT: ${CANNABEATS_ENVIRONMENT:-poc}
      CANNABEATS_ENABLE_LEGACY_STATE: ${CANNABEATS_ENABLE_LEGACY_STATE:-true}
      HOST_RELEASE_PATH: /releases/CannaBeats-Host-interim-universal.dmg
      HOST_RELEASE_NAME: CannaBeats-Host-0.5-interim-universal.dmg
      HOST_RELEASE_CHANNEL: interim
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - cannabeats_poc_data:/data
      - ${AUDIO_RELAY_INGEST_TOKEN_HOST_FILE:-./secrets/audio-relay-ingest-token}:${AUDIO_RELAY_INGEST_TOKEN_FILE:-/run/secrets/cannabeats/audio-relay-ingest-token}:ro
      - ${AUDIO_RELAY_LISTEN_TOKEN_HOST_FILE:-./secrets/audio-relay-listen-token}:${AUDIO_RELAY_LISTEN_TOKEN_FILE:-/run/secrets/cannabeats/audio-relay-listen-token}:ro
      - ${GAME_SERVICE_TOKEN_HOST_FILE:-./secrets/game-service-token}:${GAME_SERVICE_TOKEN_FILE:-/run/secrets/cannabeats/game-service-token}:ro
      - ${HOST_RELEASE_DIR:-./releases}:/releases:ro
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  game:
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_CANNABEATS_BASE_PATH: /game
        NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
    image: cannabeats/game:local
    container_name: cannabeats-game
    restart: unless-stopped
    init: true
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,mode=0755,uid=1000,gid=1000
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      CANNABEATS_APP_ORIGIN: ${APP_ORIGIN:-https://poc.cannabeats.social}
      CANNABEATS_PUBLIC_GAME_ORIGIN: ${APP_ORIGIN:-https://poc.cannabeats.social}/game
      CANNABEATS_DATABASE_PATH: /data/cannabeats-poc.sqlite
      CANNABEATS_GAME_SERVICE_TOKEN_FILE: ${GAME_SERVICE_TOKEN_FILE:-/run/secrets/cannabeats/game-service-token}
      AUDIO_RELAY_ORIGIN: ${AUDIO_RELAY_ORIGIN:-https://cannaudio.cannabeats.social}
      AUDIO_RELAY_LISTEN_TOKEN_FILE: ${AUDIO_RELAY_LISTEN_TOKEN_FILE:-/run/secrets/cannabeats/audio-relay-listen-token}
      NEXT_PUBLIC_CANNABEATS_BASE_PATH: /game
      CANNABEATS_APP_VERSION: ${CANNABEATS_APP_VERSION:-development}
      CANNABEATS_CATALOG_VERSION: ${CANNABEATS_CATALOG_VERSION:-development}
      CANNABEATS_SCHEMA_MIN_VERSION: "0"
      CANNABEATS_SCHEMA_MAX_VERSION: "2"
      CANNABEATS_SCHEMA_TARGET_VERSION: "1"
      CANNABEATS_ENVIRONMENT: ${CANNABEATS_ENVIRONMENT:-poc}
      CANNABEATS_ENABLE_LEGACY_STATE: ${CANNABEATS_ENABLE_LEGACY_STATE:-true}
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - cannabeats_poc_data:/data
      - ${AUDIO_RELAY_LISTEN_TOKEN_HOST_FILE:-./secrets/audio-relay-listen-token}:${AUDIO_RELAY_LISTEN_TOKEN_FILE:-/run/secrets/cannabeats/audio-relay-listen-token}:ro
      - ${GAME_SERVICE_TOKEN_HOST_FILE:-./secrets/game-service-token}:${GAME_SERVICE_TOKEN_FILE:-/run/secrets/cannabeats/game-service-token}:ro
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 192
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/game/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # This profile is deliberately absent from the pre-cutover release. During
  # cutover it is the only long-running service with a read-write mount of the
  # separated state database.
  state:
    profiles: ["state-cutover"]
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: state-service/Dockerfile
    image: ${CANNABEATS_STATE_IMAGE:-cannabeats/state-service:local}
    restart: unless-stopped
    init: true
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      NODE_ENV: production
      PORT: "3010"
      CANNABEATS_STATE_DATABASE_PATH: /state/cannabeats-state.sqlite
      CANNABEATS_STATE_LOCK_DIRECTORY: /state/.locks
      CANNABEATS_STATE_ROLLBACK_FLOOR_PATH: /authority/rollback-floor.json
      CANNABEATS_STATE_ACTIVATION_TOKEN_FILE: /run/secrets/cannabeats/state-activation-token
      CANNABEATS_STATE_OPERATOR_TOKEN_FILE: /run/secrets/cannabeats/state-operator-token
      CANNABEATS_STATE_ACCESS_TOKEN_FILE: /run/secrets/cannabeats/state-access-token
      CANNABEATS_STATE_GAME_TOKEN_FILE: /run/secrets/cannabeats/state-game-token
      CANNABEATS_STATE_ACCESS_PRINCIPAL_ASSERTION_KEY_FILE: /run/secrets/cannabeats/state-access-principal-assertion-key
      CANNABEATS_STATE_GAME_PRINCIPAL_ASSERTION_KEY_FILE: /run/secrets/cannabeats/state-game-principal-assertion-key
    ports:
      - "127.0.0.1:${CANNABEATS_STATE_PORT:-3010}:3010"
    volumes:
      - cannabeats_state_data:/state
      - ${CANNABEATS_STATE_AUTHORITY_DIR:-./state-authority}:/authority
      - ${STATE_ACTIVATION_TOKEN_HOST_FILE:-./secrets/state-activation-token}:/run/secrets/cannabeats/state-activation-token:ro
      - ${STATE_OPERATOR_TOKEN_HOST_FILE:-./secrets/state-operator-token}:/run/secrets/cannabeats/state-operator-token:ro
      - ${STATE_ACCESS_TOKEN_HOST_FILE:-./secrets/state-access-token}:/run/secrets/cannabeats/state-access-token:ro
      - ${STATE_GAME_TOKEN_HOST_FILE:-./secrets/state-game-token}:/run/secrets/cannabeats/state-game-token:ro
      - ${STATE_ACCESS_PRINCIPAL_ASSERTION_KEY_HOST_FILE:-./secrets/state-access-principal-assertion-key}:/run/secrets/cannabeats/state-access-principal-assertion-key:ro
      - ${STATE_GAME_PRINCIPAL_ASSERTION_KEY_HOST_FILE:-./secrets/state-game-principal-assertion-key}:/run/secrets/cannabeats/state-game-principal-assertion-key:ro
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128

  # Run only while app/game/state are stopped. It is the sole, bounded exception
  # to the state volume's runtime writer rule and never mounts the source RW.
  state-migrate:
    profiles: ["state-migration"]
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: state-service/Dockerfile
    image: ${CANNABEATS_STATE_IMAGE:-cannabeats/state-service:local}
    read_only: true
    network_mode: none
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CANNABEATS_STATE_LOCK_DIRECTORY: /state/.locks
    volumes:
      - cannabeats_poc_data:/legacy:ro
      - cannabeats_state_data:/state
    entrypoint: ["node", "scripts/migrate-monolith.mjs"]
    command:
      - --source
      - /legacy/cannabeats-poc.sqlite
      - --destination
      - /state/cannabeats-state.sqlite

  # Optional, disposable observation plane. E7.3 exposes only private
  # liveness/readiness/status; E8 adds authenticated mutation and read routes.
  diagnostics:
    profiles: ["diagnostics"]
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: diagnostics-service/Dockerfile
    image: ${CANNABEATS_DIAGNOSTICS_IMAGE:-cannabeats/diagnostics-service:local}
    restart: unless-stopped
    init: true
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /diagnostics-temp:size=8m,mode=0700,uid=1000,gid=1000
    environment:
      NODE_ENV: production
      PORT: "3020"
      CANNABEATS_DIAGNOSTIC_DATABASE_PATH: /diagnostics/cannabeats-diagnostics.sqlite
      CANNABEATS_DIAGNOSTIC_LOCK_DIRECTORY: /diagnostics/.locks
      CANNABEATS_DIAGNOSTICS_DATA_VOLUME: ${CANNABEATS_DIAGNOSTICS_DATA_VOLUME:-cannabeats_diagnostics_data}
      CANNABEATS_DATA_VOLUME: ${CANNABEATS_DATA_VOLUME:-cannabeats_poc_data}
      CANNABEATS_STATE_DATA_VOLUME: ${CANNABEATS_STATE_DATA_VOLUME:-cannabeats_state_data}
    volumes:
      - cannabeats_diagnostics_data:/diagnostics
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "4"

  backup:
    profiles: ["operations"]
    build:
      context: .
    image: cannabeats/access-spotify-poc:local
    user: node
    read_only: true
    network_mode: none
    environment:
      DATABASE_PATH: /data/cannabeats-poc.sqlite
      CANNABEATS_BACKUP_DIRECTORY: /backups
      CANNABEATS_BACKUP_SCRATCH_DIRECTORY: /scratch
      CANNABEATS_BACKUP_PASSPHRASE_FILE: /run/secrets/cannabeats/backup-passphrase
      CANNABEATS_BACKUP_KEEP: ${CANNABEATS_BACKUP_KEEP:-14}
      CANNABEATS_APP_VERSION: ${CANNABEATS_APP_VERSION:-development}
      CANNABEATS_CATALOG_VERSION: ${CANNABEATS_CATALOG_VERSION:-development}
      CANNABEATS_SCHEMA_MIN_VERSION: "0"
      CANNABEATS_SCHEMA_MAX_VERSION: "2"
      CANNABEATS_SCHEMA_TARGET_VERSION: "1"
    volumes:
      - cannabeats_poc_data:/data:ro
      - ${CANNABEATS_BACKUP_DIR:-./backups}:/backups
      - ${BACKUP_PASSPHRASE_HOST_FILE:-./secrets/backup-passphrase}:/run/secrets/cannabeats/backup-passphrase:ro
      - /scratch
    entrypoint: ["node", "operations/backup.mjs"]
    command: ["help"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  history:
    profiles: ["operations"]
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: state-service/Dockerfile
    # The operations client uses the same pinned contract artifact as State,
    # but owns no database mount and mutates only through the operator API.
    image: ${CANNABEATS_STATE_IMAGE:-cannabeats/state-service:local}
    user: node
    read_only: true
    environment:
      CANNABEATS_STATE_SERVICE_ORIGIN: http://state:3010
      CANNABEATS_STATE_OPERATOR_TOKEN_FILE: /run/secrets/cannabeats/state-operator-token
    volumes:
      - ${STATE_OPERATOR_TOKEN_HOST_FILE:-./secrets/state-operator-token}:/run/secrets/cannabeats/state-operator-token:ro
    entrypoint: ["node", "scripts/operations.mjs"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  operator:
    profiles: ["operations"]
    build:
      context: ${CANNABEATS_REPOSITORY_ROOT:-../..}
      dockerfile: spikes/access-spotify-poc/Dockerfile
    image: cannabeats/access-spotify-poc:local
    user: node
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/cannabeats-poc.sqlite
      APP_ORIGIN: http://app:3002
      GAME_SERVICE_INTERNAL_ORIGIN: http://game:3000
      AUDIO_RELAY_ORIGIN: ${AUDIO_RELAY_ORIGIN:-https://cannaudio.cannabeats.social}
      AUDIO_RELAY_LISTEN_TOKEN_FILE: /run/secrets/cannabeats/audio-relay-listen-token
      CANNABEATS_APP_VERSION: ${CANNABEATS_APP_VERSION:-development}
      CANNABEATS_CATALOG_VERSION: ${CANNABEATS_CATALOG_VERSION:-development}
      CANNABEATS_ENVIRONMENT: ${CANNABEATS_ENVIRONMENT:-poc}
    volumes:
      - cannabeats_poc_data:/data:ro
      - ${AUDIO_RELAY_LISTEN_TOKEN_HOST_FILE:-./secrets/audio-relay-listen-token}:/run/secrets/cannabeats/audio-relay-listen-token:ro
    entrypoint: ["node", "cli.mjs"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64

volumes:
  cannabeats_poc_data:
    name: ${CANNABEATS_DATA_VOLUME:-cannabeats_poc_data}
  cannabeats_state_data:
    name: ${CANNABEATS_STATE_DATA_VOLUME:-cannabeats_state_data}
  cannabeats_diagnostics_data:
    name: ${CANNABEATS_DIAGNOSTICS_DATA_VOLUME:-cannabeats_diagnostics_data}
