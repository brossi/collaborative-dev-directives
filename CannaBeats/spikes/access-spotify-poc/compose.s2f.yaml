services:
  game:
    image: ${CANNABEATS_GAME_IMAGE:-cannabeats/game:local}
    environment:
      CANNABEATS_DIAGNOSTICS_SERVICE_ORIGIN: http://127.0.0.1:3021

  diagnostics-evidence:
    profiles: ["s2f"]
    image: ${CANNABEATS_GAME_IMAGE:-cannabeats/game:local}
    user: node
    read_only: true
    init: true
    network_mode: service:game
    environment:
      CANNABEATS_DIAGNOSTICS_SERVICE_ORIGIN: http://diagnostics:3020
      CANNABEATS_DIAGNOSTICS_GAME_TOKEN_FILE: /run/secrets/cannabeats/diagnostics-game-token
      S2F_EPHEMERAL_ROLE_MAP: ${S2F_EPHEMERAL_ROLE_MAP:?Set the encrypted-manifest role map}
      S2F_TRACE_ID: ${S2F_TRACE_ID:?Set the active rehearsal trace ID}
    volumes:
      - ${DIAGNOSTICS_GAME_TOKEN_HOST_FILE:-./secrets/diagnostics-game-token}:/run/secrets/cannabeats/diagnostics-game-token:ro
    entrypoint: ["node", "/app/tools/s2f-evidence.mjs"]
    command:
      - proxy
      - --upstream
      - http://diagnostics:3020
      - --mode
      - ${S2F_FAULT_MODE:-forward}
      - --route-family
      - collector-sync
      - --port
      - "3021"
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      game:
        condition: service_started
      diagnostics:
        condition: service_healthy
